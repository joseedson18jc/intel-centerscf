<header class="topbar">
  <div class="topbar-inner">
    <button class="tb-menu-btn" id="navMenuBtn" type="button" aria-controls="sideNav" aria-expanded="false" data-i18n-aria="sn.open" aria-label="Abrir menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <!-- Current step: kept in sync with the side menu by js/31-sidenav.js -->
    <div class="tb-step" id="tbStep">
      <span class="tb-step-n" id="tbStepN" aria-hidden="true">1</span>
      <span class="tb-step-txt"><small id="tbStepOf">Etapa 1 de 4</small><strong id="tbStepName">Diagnóstico</strong></span>
    </div>
    <div class="week-bar" role="group" data-i18n-aria="aria.weekctl">
      <div class="week-bar-left">
        <button class="btn-ico" id="prev" data-i18n-aria="aria.prev"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="btn-ico play" id="play" data-i18n-aria="aria.play"><svg id="playIcon" width="15" height="15" viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z" fill="currentColor"/></svg></button>
        <button class="btn-ico" id="next" data-i18n-aria="aria.next"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="wk-pill"><small data-i18n="wk.short">Sem</small><span id="wk">13</span></div>
      </div>
      <div class="slider-wrap">
        <input type="range" id="slider" min="1" max="13" value="13" data-i18n-aria="wk">
        <div class="slider-ticks"><span id="tk-start">S1</span><span class="milestone" id="docAiTick" data-i18n="wk.docai">S5 · IA Docs</span><span id="tk-end">S13</span></div>
      </div>
    </div>
    <!-- Quick actions (js/32-v15.js): each one triggers the matching side-menu control -->
    <div class="tb-actions">
      <button class="tb-act" id="tbAsk" type="button" aria-label="Assistente" title="Assistente (/)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      </button>
      <button class="tb-act tb-export" id="tbExport" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>
        <span id="tbExportLbl">Exportar</span>
      </button>
      <button class="tb-act" id="tbTheme" type="button" aria-label="Tema" title="Tema">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
    <div id="scrollProg" aria-hidden="true"></div>
  </div>
</header>
