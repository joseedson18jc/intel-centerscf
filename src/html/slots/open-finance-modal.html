<!-- ==================== OPEN FINANCE (SIMULATED CONNECTION) MODAL ==================== -->
<div class="modal-backdrop" id="m-of" hidden role="dialog" aria-modal="true" aria-labelledby="mo-title" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-head">
      <div class="of-head">
        <span class="of-logo" id="of-logo" aria-hidden="true"></span>
        <div>
          <div class="of-lbl" data-i18n="of.badge">Demonstração · conexão simulada</div>

        </div>
      </div>
      <button class="modal-close" data-close aria-label="Fechar / Close">✕</button>
    </div>
    <div class="modal-body">
      <p class="of-p" data-i18n="of.p"></p>
      <div>
        <div class="of-k" data-i18n="of.k1">O que a integração alimentaria neste cockpit</div>
        <div class="of-grid" id="of-grid"></div>
      </div>
      <div>
        <div class="of-k" data-i18n="of.k2">Como a conexão funciona</div>
        <ol class="of-steps" id="of-steps"></ol>
      </div>
      <div class="of-status" id="of-status" role="status"></div>
      <div class="mbtns">
        <button class="mbtn pri" id="of-toggle" type="button"></button>
        <button class="mbtn" type="button" data-close data-i18n="of.close">Fechar</button>
      </div>
      <p class="of-note" data-i18n="of.note"></p>
    </div>
  </div>
</div>
