<!-- ==================== CSV DATA LOADER MODAL ==================== -->
<div class="modal-backdrop" id="m-data" hidden role="dialog" aria-modal="true" aria-labelledby="md-title" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-head">
      <div><div class="lbl" data-i18n="md.lbl">Camada de dados local · 100% no navegador</div><h3 id="md-title" data-i18n="md.h">Carregue os dados do programa</h3></div>
      <button class="modal-close" data-close aria-label="Fechar / Close">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--muted)" data-i18n="md.p"></p>
      <div class="csv-opts">
        <label><span data-i18n="md.spend">Compras no escopo (R$ bi)</span><input type="number" id="cfg-spend" value="6.0" min="0.1" max="500" step="0.1"></label>
        <label><span data-i18n="md.base">Base de fornecedores</span><input type="number" id="cfg-base" value="300" min="10" max="50000" step="10"></label>
      </div>
      <div class="mbtns">
        <button class="mbtn" id="d-tpl" data-i18n="md.tpl">Baixar modelo CSV</button>
        <label class="mbtn pri" for="d-file" data-i18n="md.load">Carregar CSV</label>
        <input type="file" id="d-file" accept=".csv,text/csv" hidden>
        <button class="mbtn" id="d-reset" data-i18n="md.reset">Voltar aos dados de demonstração</button>
      </div>
      <p id="data-msg" role="status"></p>
      <div class="proof-table-wrap">
        <table class="proof-table">
          <thead><tr><th data-i18n="md.col">Coluna</th><th data-i18n="md.mean">Significado</th></tr></thead>
          <tbody id="d-fields"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
